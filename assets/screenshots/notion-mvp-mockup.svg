<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="800" fill="url(#sidebar)"/>

  <!-- Sidebar Header -->
  <rect x="0" y="0" width="280" height="48" fill="#181825"/>
  <text x="16" y="30" fill="#cdd6f4" font-size="14" font-weight="600">AppMD</text>
  <rect x="236" y="10" width="28" height="28" rx="6" fill="#313244"/>
  <text x="245" y="29" fill="#6c7086" font-size="14">+</text>

  <!-- Search bar -->
  <rect x="12" y="56" width="256" height="32" rx="6" fill="#313244"/>
  <text x="24" y="76" fill="#6c7086" font-size="12">🔍  Search pages...</text>

  <!-- Page Tree Items -->
  <!-- Root: Getting Started -->
  <rect x="0" y="100" width="280" height="36" fill="#313244" opacity="0.5"/>
  <text x="32" y="123" fill="#cdd6f4" font-size="13">📄  Getting Started</text>
  
  <!-- Root: Project Docs (expanded) -->
  <rect x="0" y="140" width="280" height="36" fill="#45475a" opacity="0.4"/>
  <text x="12" y="163" fill="#a6adc8" font-size="10">▼</text>
  <text x="32" y="163" fill="#cdd6f4" font-size="13">📁  Project Docs</text>
  
  <!-- Child pages -->
  <rect x="0" y="176" width="280" height="32" fill="#313244" opacity="0.3"/>
  <text x="52" y="197" fill="#a6adc8" font-size="12">📄  Architecture</text>
  
  <rect x="0" y="208" width="280" height="32" fill="#313244" opacity="0.3"/>
  <text x="52" y="229" fill="#a6adc8" font-size="12">📄  API Reference</text>

  <!-- Root: Tasks -->
  <rect x="0" y="244" width="280" height="36" fill="#313244" opacity="0.3"/>
  <text x="32" y="267" fill="#cdd6f4" font-size="13">✅  Tasks</text>

  <!-- Root: Meeting Notes (selected) -->
  <rect x="0" y="284" width="280" height="36" fill="#cba6f7" opacity="0.15"/>
  <rect x="0" y="284" width="4" height="36" fill="#cba6f7"/>
  <text x="32" y="307" fill="#cba6f7" font-size="13" font-weight="600">📝  Meeting Notes</text>

  <!-- Root: Ideas -->
  <rect x="0" y="324" width="280" height="36" fill="#313244" opacity="0.3"/>
  <text x="32" y="347" fill="#cdd6f4" font-size="13">💡  Ideas</text>

  <!-- Divider -->
  <line x1="12" y1="376" x2="268" y2="376" stroke="#313244" stroke-width="1"/>

  <!-- Templates section -->
  <text x="16" y="400" fill="#6c7086" font-size="11" letter-spacing="1">TEMPLATES</text>
  <rect x="0" y="412" width="280" height="32" fill="#313244" opacity="0.2"/>
  <text x="32" y="433" fill="#a6adc8" font-size="12">📋  Meeting Notes Template</text>
  <rect x="0" y="444" width="280" height="32" fill="#313244" opacity="0.2"/>
  <text x="32" y="465" fill="#a6adc8" font-size="12">📋  Project Plan Template</text>

  <!-- Main Content Area -->
  <!-- Page title -->
  <text x="310" y="40" fill="#cdd6f4" font-size="10" letter-spacing="1">PAGE</text>
  <text x="310" y="70" fill="#cdd6f4" font-size="28" font-weight="700">📝  Meeting Notes</text>
  
  <text x="310" y="98" fill="#6c7086" font-size="12">Last edited 2 hours ago  ·  /menu</text>
  <line x1="310" y1="112" x2="1260" y2="112" stroke="#313244" stroke-width="1"/>

  <!-- Block 1: Heading 1 -->
  <rect x="296" y="130" width="964" height="44" rx="4" fill="#cba6f7" opacity="0.05"/>
  <text x="310" y="160" fill="#cdd6f4" font-size="22" font-weight="700">Q3 Planning Session</text>

  <!-- Block 2: Text -->
  <rect x="296" y="182" width="964" height="36" rx="4"/>
  <text x="310" y="206" fill="#bac2de" font-size="14">Team reviewed the roadmap for Q3 and discussed priorities for the upcoming sprint.</text>

  <!-- Block 3: Heading 2 -->
  <rect x="296" y="226" width="964" height="36" rx="4" fill="#89b4fa" opacity="0.05"/>
  <text x="310" y="250" fill="#89b4fa" font-size="18" font-weight="600">Action Items</text>

  <!-- Block 4: Todo (checked) -->
  <rect x="296" y="270" width="964" height="36" rx="4"/>
  <rect x="310" y="282" width="14" height="14" rx="3" fill="#a6e3a1"/>
  <text x="310" y="280" fill="#a6e3a1" font-size="11">✓</text>
  <text x="332" y="294" fill="#6c7086" font-size="14" text-decoration="line-through">Finalize budget proposal for Q3</text>

  <!-- Block 5: Todo (unchecked) -->
  <rect x="296" y="310" width="964" height="36" rx="4"/>
  <rect x="310" y="322" width="14" height="14" rx="3" fill="none" stroke="#585b70" stroke-width="1.5"/>
  <text x="332" y="334" fill="#bac2de" font-size="14">Schedule follow-up with design team</text>

  <!-- Block 6: Todo (unchecked) -->
  <rect x="296" y="350" width="964" height="36" rx="4"/>
  <rect x="310" y="362" width="14" height="14" rx="3" fill="none" stroke="#585b70" stroke-width="1.5"/>
  <text x="332" y="374" fill="#bac2de" font-size="14">Update project timeline in Notion</text>

  <!-- Block 7: Heading 2 -->
  <rect x="296" y="394" width="964" height="36" rx="4" fill="#89b4fa" opacity="0.05"/>
  <text x="310" y="418" fill="#89b4fa" font-size="18" font-weight="600">Discussion Notes</text>

  <!-- Block 8: Bulleted List -->
  <rect x="296" y="438" width="964" height="36" rx="4"/>
  <text x="310" y="462" fill="#cba6f7" font-size="14">•</text>
  <text x="328" y="462" fill="#bac2de" font-size="14">New design system should be ready by August</text>

  <!-- Block 9: Bulleted List -->
  <rect x="296" y="478" width="964" height="36" rx="4"/>
  <text x="310" y="502" fill="#cba6f7" font-size="14">•</text>
  <text x="328" y="502" fill="#bac2de" font-size="14">Backend migration to Rust is on track for September</text>

  <!-- Block 10: Quote -->
  <rect x="296" y="522" width="964" height="48" rx="4" fill="#a6e3a1" opacity="0.05"/>
  <rect x="304" y="530" width="4" height="32" rx="2" fill="#a6e3a1"/>
  <text x="322" y="546" fill="#a6e3a1" font-size="12" font-style="italic">"We should prioritize developer experience in Q3 to reduce onboarding time."</text>
  <text x="322" y="562" fill="#6c7086" font-size="10">— Sarah, Engineering Lead</text>

  <!-- Block 11: Code -->
  <rect x="296" y="582" width="964" height="52" rx="6" fill="#11111b"/>
  <rect x="296" y="582" width="964" height="24" rx="6" fill="#181825"/>
  <rect x="1220" y="588" width="28" height="14" rx="3" fill="#313244"/>
  <text x="1226" y="599" fill="#6c7086" font-size="9">Copy</text>
  <text x="1216" y="600" fill="#6c7086" font-size="11">📋</text>
  <text x="308" y="599" fill="#6c7086" font-size="10">rust</text>
  <text x="310" y="626" fill="#a6e3a1" font-size="12">fn process_data() → Result&lt;()&gt; {</text>
  <text x="310" y="642" fill="#89b4fa" font-size="12">    let result = analyze(&amp;input)?;</text>
  <text x="310" y="658" fill="#fab387" font-size="12">    println!("Done: {}", result);</text>
  <text x="310" y="674" fill="#a6e3a1" font-size="12">}</text>

  <!-- Block 12: Divider -->
  <line x1="310" y1="718" x2="1260" y2="718" stroke="#313244" stroke-width="1"/>

  <!-- Block 13: Add block placeholder -->
  <rect x="310" y="732" width="964" height="40" rx="6" fill="none" stroke="#45475a" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="320" y="757" fill="#6c7086" font-size="13">+  Add a block. Type / for commands</text>

  <!-- Drag handle indicators on hover (subtle) -->
  <text x="290" y="160" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="206" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="250" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="294" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="334" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="374" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="418" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="462" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="502" fill="#585b70" font-size="10" opacity="0.6">⠿</text>
  <text x="290" y="546" fill="#585b70" font-size="10" opacity="0.6">⠿</text>

  <!-- Block type indicator (hover toolbar) -->
  <rect x="296" y="130" width="964" height="44" rx="4" fill="#cba6f7" opacity="0"/>
</svg>
